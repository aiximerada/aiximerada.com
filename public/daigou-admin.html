<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代購後台</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Noto Sans TC","Segoe UI",sans-serif}
  :root{--line:#06C755;--bg:#0f1420;--card:#182130;--line2:#26324a;--txt:#e8eefc;--muted:#8b98b5;--gold:#f2c94c;--blue:#3b6cff}
  body{background:var(--bg);color:var(--txt);min-height:100vh}
  header{position:sticky;top:0;z-index:20;background:rgba(15,20,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line2);padding:12px 16px;display:flex;align-items:center;gap:12px}
  header a.back{color:var(--txt);text-decoration:none;font-size:20px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px}
  header a.back:hover{background:var(--line2)}
  header h1{font-size:19px;display:flex;align-items:center;gap:8px;flex:1}
  header .exportBtn{background:var(--line);color:#fff;border:none;border-radius:12px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
  header .exportBtn:active{transform:scale(.96)}
  header .exportBtn:disabled{opacity:.4;cursor:not-allowed}
  .wrap{max-width:900px;margin:0 auto;padding:16px 14px 80px}
  /* 統計列 */
  .stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .stats .chip{background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:7px 14px;font-size:13px;display:flex;align-items:center;gap:7px}
  .stats .chip b{color:var(--gold);font-size:15px}
  .stats .chip.total b{color:var(--blue)}
  .stats .chip .badge{background:var(--line2);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;color:var(--txt)}
  /* 訂單卡片 */
  .cards{display:flex;flex-direction:column;gap:12px}
  .ocard{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:14px}
  .ocard .top{display:flex;gap:12px;align-items:flex-start}
  .ocard .thumb{width:56px;height:56px;border-radius:12px;background:#0d1117 center/cover no-repeat;flex-shrink:0;border:1px solid var(--line2)}
  .ocard .head{flex:1;min-width:0}
  .ocard .pname{font-size:15.5px;font-weight:700;line-height:1.35;word-break:break-word}
  .ocard .time{font-size:12px;color:var(--muted);margin-top:3px}
  .ocard .qtyBig{font-size:14px;color:var(--gold);font-weight:700;white-space:nowrap}
  .ocard .rows{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
  @media(max-width:520px){.ocard .rows{grid-template-columns:1fr}}
  .ocard .kv{font-size:13px;display:flex;gap:6px;min-width:0}
  .ocard .kv .k{color:var(--muted);flex-shrink:0}
  .ocard .kv .v{color:var(--txt);word-break:break-word}
  .ocard .kv .v a{color:var(--blue);text-decoration:none}
  .ocard .kv .v a:hover{text-decoration:underline}
  .ocard .ctrl{margin-top:12px;border-top:1px dashed var(--line2);padding-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:11.5px;color:var(--muted)}
  .fld select,.fld input{background:#0d1117;border:1px solid var(--line2);border-radius:10px;padding:9px 11px;color:var(--txt);font-size:14px}
  .fld select{cursor:pointer;min-width:120px}
  .fld input[type=number]{width:120px}
  .fld.saved select,.fld.saved input{border-color:var(--line);box-shadow:0 0 0 2px rgba(6,199,85,.25)}
  .costGrp{display:flex;gap:8px;align-items:flex-end}
  .costGrp button{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer;height:38px}
  .costGrp button:active{transform:scale(.96)}
  .note{margin-top:10px;font-size:12.5px;color:var(--muted);background:#0d1117;border-radius:10px;padding:8px 11px}
  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  /* 非管理員 / 提示卡 */
  .msgcard{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:26px 22px;max-width:460px;margin:40px auto;text-align:center}
  .msgcard .ic{font-size:44px;margin-bottom:14px}
  .msgcard h2{font-size:20px;margin-bottom:10px}
  .msgcard p{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:18px}
  .idbox{background:#0d1117;border:1px dashed var(--line2);border-radius:12px;padding:14px;margin-bottom:14px}
  .idbox .lbl{font-size:12px;color:var(--muted);margin-bottom:8px}
  .idbox code{display:block;font-size:14px;color:var(--gold);word-break:break-all;font-family:"Consolas",monospace;line-height:1.5}
  .copyBtn{background:var(--line);color:#fff;border:none;border-radius:12px;padding:12px 22px;font-size:15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .copyBtn:active{transform:scale(.96)}
  .hint{font-size:12px;color:#5b6b8c;margin-top:14px;line-height:1.6}
  .hide{display:none!important}
</style>
</head>
<body>

<header>
  <a class="back" href="daigou.html" title="返回"><i class="fa-solid fa-arrow-left"></i></a>
  <h1>🛠️ 代購後台</h1>
  <button class="exportBtn hide" id="exportBtn" title="匯出 Excel"><i class="fa-solid fa-file-arrow-down"></i> 匯出 Excel</button>
</header>

<div class="wrap">
  <div id="stats" class="stats hide"></div>
  <div id="content"><div class="empty">載入中…</div></div>
</div>

<script type="module">
import { db } from "./js/firebase-config.js";
import { LIFF_ID, ORDER_STATUS, isAdminUser } from "./js/daigou-config.js";
import { doc,getDoc,updateDoc,collection,query,orderBy,getDocs,serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const $ = s => document.querySelector(s);
let me = null;
let orders = [];

/* ---------- 工具 ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }

// 把 Firestore Timestamp / Date / 數字 / 字串 都容錯轉成 Date（失敗回 null）
function toDate(v){
  if(!v) return null;
  try{
    if(typeof v.toDate === "function") return v.toDate();     // Firestore Timestamp
    if(typeof v.seconds === "number") return new Date(v.seconds*1000);
    if(v instanceof Date) return v;
    const d = new Date(v);
    return isNaN(d.getTime()) ? null : d;
  }catch(_){ return null; }
}
function fmtDate(v){
  const d = toDate(v);
  if(!d) return "—";
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ---------- LINE 登入 ---------- */
async function initLine(){
  await liff.init({ liffId: LIFF_ID });
  if(!liff.isLoggedIn()){ liff.login(); return false; }
  const p = await liff.getProfile();
  const snap = await getDoc(doc(db,"users",p.userId));
  me = {
    lineUserId: p.userId,
    displayName: p.displayName,
    realName: (snap.exists() && snap.data().realName) || p.displayName,
    isAdmin: isAdminUser(p.userId, snap.exists()?snap.data():null)
  };
  return true;
}

/* ---------- 非管理員畫面：顯示 LINE ID 供站長設定 ---------- */
function renderNotAdmin(){
  $("#content").innerHTML = `
    <div class="msgcard">
      <div class="ic">🔒</div>
      <h2>你不是管理員</h2>
      <p>這個頁面僅限管理員使用。<br>若你是站長本人，請把下面這串 LINE ID 設定為管理員。</p>
      <div class="idbox">
        <div class="lbl">你的 LINE ID</div>
        <code id="lineIdText">${esc(me.lineUserId)}</code>
      </div>
      <button class="copyBtn" id="copyId"><i class="fa-regular fa-copy"></i> 複製 LINE ID</button>
      <div class="hint">把這串 ID 提供給站長，加進 <b>js/daigou-config.js</b> 的 <b>ADMIN_IDS</b>（或在 users 文件設 isAdmin:true），即可取得管理權限。</div>
    </div>`;
  $("#copyId").onclick = async () => {
    const btn = $("#copyId");
    try{
      await navigator.clipboard.writeText(me.lineUserId);
    }catch(_){
      // 後備方案：選取文字
      const r = document.createRange(); r.selectNode($("#lineIdText"));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      try{ document.execCommand("copy"); sel.removeAllRanges(); }catch(__){}
    }
    btn.innerHTML = '<i class="fa-solid fa-check"></i> 已複製！';
    setTimeout(()=>{ btn.innerHTML = '<i class="fa-regular fa-copy"></i> 複製 LINE ID'; }, 1800);
  };
}

/* ---------- 載入全部訂單 ---------- */
async function loadOrders(){
  orders = [];
  try{
    const qs = await getDocs(query(collection(db,"orders"), orderBy("createdAt","desc")));
    qs.forEach(d => orders.push({ id:d.id, ...d.data() }));
  }catch(e){
    // index 或排序丟錯 → fallback 不帶 orderBy，前端自行排序
    try{
      const qs = await getDocs(collection(db,"orders"));
      qs.forEach(d => orders.push({ id:d.id, ...d.data() }));
      orders.sort((a,b) => {
        const ta = toDate(a.createdAt), tb = toDate(b.createdAt);
        return (tb?tb.getTime():0) - (ta?ta.getTime():0);
      });
    }catch(e2){
      $("#content").innerHTML = `<div class="empty">⚠️ 載入訂單失敗<br>${esc((e2 && e2.message)||e2)}</div>`;
      return;
    }
  }
  $("#exportBtn").classList.remove("hide");
  renderStats();
  renderOrders();
}

/* ---------- 統計列 ---------- */
function renderStats(){
  const el = $("#stats");
  el.classList.remove("hide");
  const counts = {};
  ORDER_STATUS.forEach(s => counts[s] = 0);
  orders.forEach(o => { const s = o.status || "下單"; counts[s] = (counts[s]||0) + 1; });
  let html = `<div class="chip total">總訂單 <b>${orders.length}</b></div>`;
  html += ORDER_STATUS.map(s => `<div class="chip">${esc(s)} <span class="badge">${counts[s]||0}</span></div>`).join("");
  el.innerHTML = html;
}

/* ---------- 訂單卡片列表 ---------- */
function renderOrders(){
  const el = $("#content");
  if(!orders.length){ el.innerHTML = `<div class="empty">目前還沒有任何訂單。</div>`; return; }
  el.innerHTML = `<div class="cards">${orders.map(cardHTML).join("")}</div>`;
  orders.forEach(bindCard);
}

function cardHTML(o){
  const price = `${esc(o.productCurrency||"NT$")} ${o.productPrice??"—"}`;
  const options = ORDER_STATUS.map(s =>
    `<option value="${esc(s)}"${ (o.status||"下單")===s ? " selected":"" }>${esc(s)}</option>`).join("");
  const slip = o.paySlipUrl
    ? `<a href="${esc(o.paySlipUrl)}" target="_blank" rel="noopener"><i class="fa-solid fa-image"></i> 看截圖</a>`
    : `<span class="v" style="color:var(--muted)">無</span>`;
  const thumb = o.productPhoto ? `style="background-image:url('${esc(o.productPhoto)}')"` : "";
  return `
  <div class="ocard" data-id="${esc(o.id)}">
    <div class="top">
      <div class="thumb" ${thumb}></div>
      <div class="head">
        <div class="pname">${esc(o.productName||"未命名商品")}</div>
        <div class="time"><i class="fa-regular fa-clock"></i> ${fmtDate(o.createdAt)}</div>
      </div>
      <div class="qtyBig">×${esc(o.qty??1)}</div>
    </div>
    <div class="rows">
      <div class="kv"><span class="k">本名</span><span class="v">${esc(o.buyerRealName||"—")}</span></div>
      <div class="kv"><span class="k">LINE 暱稱</span><span class="v">${esc(o.buyerDisplayName||"—")}</span></div>
      <div class="kv"><span class="k">預估單價</span><span class="v">${price}</span></div>
      <div class="kv"><span class="k">付款方式</span><span class="v">${esc(o.payType||"—")}</span></div>
      <div class="kv"><span class="k">匯款末五碼</span><span class="v">${esc(o.payLast5||"—")}</span></div>
      <div class="kv"><span class="k">付款截圖</span><span class="v">${slip}</span></div>
    </div>
    ${ o.note ? `<div class="note"><i class="fa-regular fa-note-sticky"></i> ${esc(o.note)}</div>` : "" }
    <div class="ctrl">
      <div class="fld" data-role="statusFld">
        <label>狀態</label>
        <select data-role="status">${options}</select>
      </div>
      <div class="fld costGrp" data-role="costFld">
        <div class="fld">
          <label>實付金額</label>
          <input type="number" data-role="cost" value="${Number(o.costPaid)||0}" min="0" step="1">
        </div>
        <button data-role="saveCost"><i class="fa-solid fa-floppy-disk"></i> 儲存</button>
      </div>
    </div>
  </div>`;
}

function flash(fld){
  fld.classList.add("saved");
  setTimeout(()=>fld.classList.remove("saved"), 1200);
}

function bindCard(o){
  const card = document.querySelector(`.ocard[data-id="${cssEsc(o.id)}"]`);
  if(!card) return;

  const sel = card.querySelector('[data-role="status"]');
  const statusFld = card.querySelector('[data-role="statusFld"]');
  sel.addEventListener("change", async () => {
    const v = sel.value;
    sel.disabled = true;
    try{
      await updateDoc(doc(db,"orders",o.id), { status:v, updatedAt:serverTimestamp() });
      o.status = v;
      flash(statusFld);
      renderStats();
    }catch(err){
      alert("狀態更新失敗：" + ((err && err.message)||err));
    }finally{
      sel.disabled = false;
    }
  });

  const costInput = card.querySelector('[data-role="cost"]');
  const costFld = card.querySelector('[data-role="costFld"]');
  const saveBtn = card.querySelector('[data-role="saveCost"]');
  saveBtn.addEventListener("click", async () => {
    const v = Number(costInput.value) || 0;
    saveBtn.disabled = true;
    const orig = saveBtn.innerHTML;
    try{
      await updateDoc(doc(db,"orders",o.id), { costPaid:v, updatedAt:serverTimestamp() });
      o.costPaid = v;
      flash(costFld);
      saveBtn.innerHTML = '<i class="fa-solid fa-check"></i> 已存';
      setTimeout(()=>{ saveBtn.innerHTML = orig; }, 1200);
    }catch(err){
      alert("實付金額儲存失敗：" + ((err && err.message)||err));
    }finally{
      saveBtn.disabled = false;
    }
  });
}

// 供 querySelector 使用的簡易屬性值跳脫
function cssEsc(s){
  if(window.CSS && CSS.escape) return CSS.escape(s);
  return String(s).replace(/["\\]/g, "\\$&");
}

/* ---------- 匯出 Excel ---------- */
function exportExcel(){
  const rows = orders.map(o => ({
    "下單時間": fmtDate(o.createdAt),
    "商品": o.productName || "",
    "買家本名": o.buyerRealName || "",
    "LINE暱稱": o.buyerDisplayName || "",
    "數量": o.qty ?? "",
    "預估單價": o.productPrice ?? "",
    "幣別": o.productCurrency || "",
    "付款方式": o.payType || "",
    "匯款末五碼": o.payLast5 || "",
    "狀態": o.status || "",
    "實付金額": Number(o.costPaid) || 0,
    "備註": o.note || "",
    "買家LINE_ID": o.buyerLineId || o.buyerUid || "",
    "訂單ID": o.id
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "代購訂單");
  XLSX.writeFile(wb, "代購訂單.xlsx");
}

/* ---------- 啟動 ---------- */
async function boot(){
  try{
    const ok = await initLine();
    if(!ok) return; // 導去登入，回來會重新執行
  }catch(e){
    $("#content").innerHTML = `<div class="empty">⚠️ LINE 服務初始化失敗<br>若你是站長，請確認 LIFF Endpoint 已包含本頁網址<br><small>${esc((e && e.message)||e)}</small></div>`;
    return;
  }
  if(!me.isAdmin){
    renderNotAdmin();
    return;
  }
  $("#exportBtn").onclick = exportExcel;
  await loadOrders();
}

boot();
</script>
</body>
</html>
