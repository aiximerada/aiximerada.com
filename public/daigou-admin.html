<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代購後台 · 管理員</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Noto Sans TC","Segoe UI",sans-serif}
  :root{--line:#06C755;--bg:#0f1420;--card:#182130;--line2:#26324a;--txt:#e8eefc;--muted:#8b98b5;--gold:#f2c94c;--blue:#3b6cff;--red:#ff5a6a}
  body{background:var(--bg);color:var(--txt);min-height:100vh}
  header{position:sticky;top:0;z-index:10;background:rgba(15,20,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line2);padding:12px 16px;display:flex;align-items:center;gap:12px}
  header a.back{color:var(--muted);text-decoration:none;font-size:20px}
  header h1{font-size:18px;flex:1}
  .wrap{max-width:960px;margin:0 auto;padding:18px 16px 60px}

  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--line);color:#053d1c;border:none;border-radius:10px;padding:10px 15px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
  .btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--txt)}
  .btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  #globalMsg{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px}
  .warn{background:rgba(242,201,76,.1);border:1px solid rgba(242,201,76,.35);color:var(--gold);border-radius:12px;padding:14px;font-size:14px;margin-bottom:16px;line-height:1.7}

  /* 統計列 */
  .stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;align-items:center}
  .stat-total{font-size:15px;font-weight:700;margin-right:6px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--txt);background:var(--card);border:1px solid var(--line2);padding:5px 11px;border-radius:999px}
  .badge b{color:var(--gold);font-weight:800}
  .badge.cancel b{color:var(--red)}

  /* 訂單卡片 */
  .card{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:16px;margin-bottom:16px}
  .ohead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .buyer{min-width:0}
  .buyer .name{font-size:16px;font-weight:700;word-break:break-word}
  .buyer .sub{font-size:13px;color:var(--muted);line-height:1.7;margin-top:2px}
  .buyer .sub b{color:var(--txt);font-weight:600}
  .statwrap{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .statwrap label{font-size:11px;color:var(--muted)}
  select.status{background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;color:var(--txt);font-size:14px;font-weight:700;cursor:pointer;transition:.2s}
  select.status.ok{border-color:var(--line);box-shadow:0 0 0 3px rgba(6,199,85,.18)}
  select.status.cancelled{color:var(--red);border-color:rgba(255,90,106,.5)}

  .pay{margin:12px 0;padding:11px 12px;background:var(--bg);border:1px solid var(--line2);border-radius:12px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
  .pay b{color:var(--txt);font-weight:600}
  .pay a{color:var(--blue);text-decoration:none}

  /* 商品清單 */
  .items{border-top:1px dashed var(--line2);margin-top:6px}
  .item{padding:12px 0;border-bottom:1px dashed var(--line2)}
  .item:last-child{border-bottom:none}
  .item .iname{font-size:15px;font-weight:600;word-break:break-word}
  .item .imeta{font-size:12.5px;color:var(--muted);line-height:1.8;margin-top:3px}
  .item .imeta b{color:var(--txt);font-weight:600}
  .item .imeta .price{color:var(--gold);font-weight:700}
  .item .imeta a{color:var(--blue);text-decoration:none}
  .item .inote{white-space:pre-wrap;word-break:break-word}
  .item.cancelled .iname,.item.cancelled .imeta{text-decoration:line-through;opacity:.6}
  .tag-cancel{display:inline-block;font-size:11px;font-weight:700;color:var(--red);background:rgba(255,90,106,.12);border:1px solid rgba(255,90,106,.4);padding:1px 8px;border-radius:999px;margin-left:6px;text-decoration:none!important}
  .costrow{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
  .costrow label{font-size:12px;color:var(--muted)}
  .costrow input{width:120px;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;color:var(--txt);font-size:15px}
  .costrow .csaved{font-size:12px;color:var(--line);min-width:20px}

  .totals{margin-top:14px;padding-top:12px;border-top:1px solid var(--line2);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:14px}
  .totals .est{color:var(--muted)}
  .totals .est b{color:var(--txt);font-weight:700}
  .totals .real b{color:var(--gold);font-weight:800;font-size:16px}

  /* 非管理員卡片 */
  .denied{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:24px;text-align:center}
  .denied i{font-size:44px;color:var(--gold);margin-bottom:14px;display:block}
  .denied h2{font-size:18px;margin-bottom:10px}
  .denied p{font-size:14px;color:var(--muted);line-height:1.8;margin-bottom:14px}
  .idbox{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:14px 0}
  .idbox code{background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--gold);word-break:break-all;font-family:"SFMono-Regular",Consolas,monospace}
</style>
</head>
<body>
<header>
  <a class="back" href="daigou.html" aria-label="返回"><i class="fa-solid fa-arrow-left"></i></a>
  <h1>代購後台</h1>
  <button class="btn" id="exportBtn" style="display:none"><i class="fa-solid fa-file-excel"></i> 匯出 Excel</button>
</header>
<div class="wrap">
  <div id="globalMsg"><i class="fa-solid fa-spinner fa-spin"></i> 載入中…</div>
  <div id="content"></div>
</div>

<script type="module">
import { db } from "./js/firebase-config.js";
import { LIFF_ID, ORDER_STATUS, isAdminUser } from "./js/daigou-config.js";
import { doc,getDoc,updateDoc,collection,getDocs,serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { readCachedMe, ensureFreshMe } from "./js/daigou-auth.js";

let me=null;
let orders=[];        // [{id,...data, _items:[]}]
const $ = s => document.querySelector(s);

// 狀態下拉選項 = 六個流程狀態 + 已取消
const ALL_STATUS = [...ORDER_STATUS, "已取消"];

// ---- 工具 ----
function esc(v){
  return String(v==null?"":v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function toMs(ts){
  if(!ts) return 0;
  if(typeof ts.toDate==="function") return ts.toDate().getTime();
  if(ts instanceof Date) return ts.getTime();
  if(typeof ts==="number") return ts;
  if(ts.seconds!=null) return ts.seconds*1000;
  return 0;
}
function fmtDate(ts){
  const ms=toMs(ts);
  if(!ms) return "";
  const d=new Date(ms);
  if(isNaN(d.getTime())) return "";
  const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function num(v){ const n=Number(v); return isNaN(n)?0:n; }

// ---- LINE 登入 ----
async function initLine(){
  await liff.init({liffId:LIFF_ID});
  if(!liff.isLoggedIn()){ liff.login(); return false; }
  const p=await liff.getProfile();
  const snap=await getDoc(doc(db,"users",p.userId));
  me={ lineUserId:p.userId, realName:(snap.exists()&&snap.data().realName)||p.displayName, isAdmin:isAdminUser(p.userId, snap.exists()?snap.data():null) };
  return true;
}

// ---- 讀取全部資料 ----
async function loadAll(){
  const [oSnap,iSnap]=await Promise.all([
    getDocs(collection(db,"orders")),
    getDocs(collection(db,"daigouItems"))
  ]);
  const oList=[]; oSnap.forEach(d=>oList.push({id:d.id,...d.data()}));
  const itemsByOrder={};
  iSnap.forEach(d=>{
    const it={id:d.id,...d.data()};
    const oid=it.orderId||"";
    (itemsByOrder[oid]=itemsByOrder[oid]||[]).push(it);
  });
  oList.forEach(o=>{ o._items=itemsByOrder[o.id]||[]; });
  oList.sort((a,b)=>toMs(b.createdAt)-toMs(a.createdAt));
  orders=oList;
}

// ---- 統計列 ----
function statsHtml(){
  const counts={}; ALL_STATUS.forEach(s=>counts[s]=0);
  orders.forEach(o=>{ const s=o.status||ORDER_STATUS[0]; if(counts[s]==null) counts[s]=0; counts[s]++; });
  let html=`<div class="stat-total">總訂單 <b style="color:var(--line)">${orders.length}</b> 筆</div>`;
  html+=ALL_STATUS.map(s=>
    `<span class="badge ${s==="已取消"?"cancel":""}">${esc(s)} <b>${counts[s]||0}</b></span>`
  ).join("");
  return `<div class="stats" id="stats">${html}</div>`;
}
function refreshStats(){
  const el=$("#stats");
  if(el) el.outerHTML=statsHtml();
}

// ---- 單筆訂單卡片 ----
function orderCard(o){
  const cur=o.status||ORDER_STATUS[0];
  const opts=ALL_STATUS.map(s=>`<option value="${esc(s)}"${s===cur?" selected":""}>${esc(s)}</option>`).join("");

  // 付款資訊
  const payBits=[];
  if(o.payType) payBits.push(`付款方式 <b>${esc(o.payType)}</b>`);
  if(o.payLast5) payBits.push(`末五碼 <b>${esc(o.payLast5)}</b>`);
  if(o.paySlipUrl) payBits.push(`<a href="${esc(o.paySlipUrl)}" target="_blank" rel="noopener"><i class="fa-solid fa-image"></i> 看截圖</a>`);
  const payHtml = payBits.length
    ? `<div class="pay"><i class="fa-solid fa-money-check-dollar"></i> ${payBits.join("")}</div>` : "";

  // 商品清單
  let est=0, real=0;
  const itemsHtml = (o._items||[]).map(it=>{
    const cancelled = it.cancelled===true;
    if(!cancelled){
      est  += num(it.price)*num(it.qty||1);
      real += num(it.costPaid);
    }
    const priceStr = (it.price!=null && it.price!=="")
      ? `<span class="price">${esc(it.currency||"")}${esc(it.price)}</span>` : "";
    const meta=[];
    meta.push(`數量 <b>${esc(it.qty!=null?it.qty:1)}</b>${priceStr?` ・ 預估單價 ${priceStr}`:""}`);
    if(it.store) meta.push(`店家 <b>${esc(it.store)}</b>`);
    if(it.refLink) meta.push(`<a href="${esc(it.refLink)}" target="_blank" rel="noopener"><i class="fa-solid fa-link"></i> 參考連結</a>`);
    if(it.note) meta.push(`<span class="inote">備註：${esc(it.note)}</span>`);
    return `
      <div class="item ${cancelled?"cancelled":""}">
        <div class="iname">${esc(it.name||"（未命名）")}${cancelled?`<span class="tag-cancel">已取消</span>`:""}</div>
        <div class="imeta">${meta.map(m=>`<div>${m}</div>`).join("")}</div>
        <div class="costrow">
          <label>實付金額</label>
          <input type="number" step="any" inputmode="decimal" value="${esc(num(it.costPaid))}" data-cost="${esc(it.id)}">
          <button class="btn ghost sm" data-savecost="${esc(it.id)}"><i class="fa-solid fa-floppy-disk"></i> 儲存</button>
          <span class="csaved" id="csaved-${esc(it.id)}"></span>
        </div>
      </div>`;
  }).join("");

  return `
  <div class="card" data-order="${esc(o.id)}">
    <div class="ohead">
      <div class="buyer">
        <div class="name">${esc(o.ownerRealName||"（未填本名）")}</div>
        <div class="sub">
          <div>LINE 暱稱 <b>${esc(o.ownerDisplayName||"—")}</b></div>
          <div>下單時間 <b>${esc(fmtDate(o.createdAt)||"—")}</b> ・ 共 <b>${esc(o.itemCount!=null?o.itemCount:(o._items||[]).length)}</b> 件</div>
        </div>
      </div>
      <div class="statwrap">
        <label>訂單狀態</label>
        <select class="status ${cur==="已取消"?"cancelled":""}" data-status="${esc(o.id)}">${opts}</select>
      </div>
    </div>
    ${payHtml}
    <div class="items">${itemsHtml||`<div class="item"><div class="imeta">此訂單沒有商品</div></div>`}</div>
    <div class="totals">
      <div class="est">預估總額 <b>${est.toLocaleString()}</b></div>
      <div class="real">實付總額 <b>${real.toLocaleString()}</b></div>
    </div>
  </div>`;
}

// ---- 渲染管理員畫面 ----
function renderAdmin(){
  $("#exportBtn").style.display="";
  const c=$("#content");
  if(!orders.length){
    c.innerHTML=statsHtml()+`<div class="warn"><i class="fa-solid fa-inbox"></i> 目前沒有任何訂單。</div>`;
    return;
  }
  c.innerHTML=statsHtml()+orders.map(orderCard).join("");
}

// ---- 非管理員畫面 ----
function renderDenied(){
  const c=$("#content");
  c.innerHTML=`
    <div class="denied">
      <i class="fa-solid fa-lock"></i>
      <h2>你不是管理員</h2>
      <p>此頁面僅限培根代購管理員使用。<br>若你應該有權限，請把下方的 LINE ID 傳給站長開通。</p>
      <div class="idbox">
        <code id="myId">${esc(me.lineUserId)}</code>
        <button class="btn ghost sm" id="copyId"><i class="fa-solid fa-copy"></i> 複製</button>
      </div>
    </div>`;
  $("#copyId").addEventListener("click", async ()=>{
    const txt=me.lineUserId;
    const btn=$("#copyId");
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(txt);
      }else{
        const ta=document.createElement("textarea");
        ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
        document.body.appendChild(ta); ta.focus(); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta);
      }
      btn.innerHTML='<i class="fa-solid fa-check"></i> 已複製';
      setTimeout(()=>{ btn.innerHTML='<i class="fa-solid fa-copy"></i> 複製'; },1800);
    }catch(e){
      btn.innerHTML='<i class="fa-solid fa-xmark"></i> 複製失敗';
    }
  });
}

// ---- 更新訂單狀態 ----
async function changeStatus(orderId, value, selEl){
  selEl.disabled=true;
  try{
    await updateDoc(doc(db,"orders",orderId), { status:value, updatedAt:serverTimestamp() });
    const o=orders.find(x=>x.id===orderId); if(o) o.status=value;
    selEl.classList.add("ok");
    selEl.classList.toggle("cancelled", value==="已取消");
    setTimeout(()=>selEl.classList.remove("ok"),1500);
    refreshStats();
  }catch(e){
    alert("更新狀態失敗："+(e.message||e));
  }finally{
    selEl.disabled=false;
  }
}

// ---- 儲存實付金額 ----
async function saveCost(itemId, btn){
  const input=document.querySelector(`[data-cost="${CSS.escape(itemId)}"]`);
  const tag=$(`#csaved-${CSS.escape(itemId)}`);
  if(!input) return;
  const val=num(input.value);
  btn.disabled=true;
  try{
    await updateDoc(doc(db,"daigouItems",itemId), { costPaid:val });
    // 同步到記憶體 + 重算該卡片總額
    for(const o of orders){
      const it=(o._items||[]).find(x=>x.id===itemId);
      if(it){
        it.costPaid=val;
        const card=document.querySelector(`.card[data-order="${CSS.escape(o.id)}"] .totals .real b`);
        if(card){
          let real=0;
          (o._items||[]).forEach(x=>{ if(x.cancelled!==true) real+=num(x.costPaid); });
          card.textContent=real.toLocaleString();
        }
        break;
      }
    }
    if(tag){ tag.textContent="✔ 已存"; setTimeout(()=>{ tag.textContent=""; },1600); }
  }catch(e){
    if(tag){ tag.style.color="var(--red)"; tag.textContent="失敗"; }
  }finally{
    btn.disabled=false;
  }
}

// ---- 匯出 Excel ----
function exportExcel(){
  const rows=[];
  orders.forEach(o=>{
    const created=fmtDate(o.createdAt);
    (o._items||[]).forEach(it=>{
      rows.push({
        "下單時間": created,
        "訂單ID": o.id,
        "買家本名": o.ownerRealName||"",
        "LINE暱稱": o.ownerDisplayName||"",
        "商品": it.name||"",
        "數量": it.qty!=null?it.qty:1,
        "預估單價": (it.price!=null&&it.price!=="")?num(it.price):"",
        "幣別": it.currency||"",
        "店家": it.store||"",
        "參考連結": it.refLink||"",
        "訂單狀態": o.status||ORDER_STATUS[0],
        "是否取消": it.cancelled===true?"是":"否",
        "實付金額": num(it.costPaid),
        "末五碼": o.payLast5||"",
        "備註": it.note||"",
        "買家LINE_ID": o.ownerLineId||""
      });
    });
  });
  if(!rows.length){ alert("目前沒有可匯出的商品資料。"); return; }
  const header=["下單時間","訂單ID","買家本名","LINE暱稱","商品","數量","預估單價","幣別","店家","參考連結","訂單狀態","是否取消","實付金額","末五碼","備註","買家LINE_ID"];
  const ws=XLSX.utils.json_to_sheet(rows,{header});
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"代購訂單");
  XLSX.writeFile(wb,"代購訂單.xlsx");
}

// ---- 事件委派 ----
$("#content").addEventListener("change", e=>{
  const sel=e.target.closest("select.status");
  if(sel){ changeStatus(sel.dataset.status, sel.value, sel); }
});
$("#content").addEventListener("click", e=>{
  const sc=e.target.closest("[data-savecost]");
  if(sc){ saveCost(sc.dataset.savecost, sc); }
});
$("#exportBtn").addEventListener("click", exportExcel);

// ---- 啟動(快取優先,背景驗證) ----
(async function(){
  const g=$("#globalMsg");
  try{
    const cached=readCachedMe();
    if(cached && cached.realName){
      me={ lineUserId:cached.lineUserId, realName:cached.realName, isAdmin:isAdminUser(cached.lineUserId, null) };
      if(me.isAdmin){
        g.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> 載入所有訂單中…';
        try{ await loadAll(); g.style.display="none"; renderAdmin(); }catch(e){}
      }
    }
    const fresh=await ensureFreshMe();  // 未登入會自動跳轉
    me={ lineUserId:fresh.lineUserId, realName:fresh.realName, isAdmin:isAdminUser(fresh.lineUserId, null) };
    if(!me.isAdmin){
      g.style.display="none";
      renderDenied();
      return;
    }
    g.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> 載入所有訂單中…';
    await loadAll();
    g.style.display="none";
    renderAdmin();
  }catch(e){
    g.innerHTML=`<div class="warn"><i class="fa-solid fa-triangle-exclamation"></i> 無法載入後台（LINE 登入或連線問題）：${esc(e.message||e)}<br>請部署到網域後，於手機 LINE 內開啟。</div>`;
  }
})();
</script>
</body>
</html>
