<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>培根代購</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Noto Sans TC","Segoe UI",sans-serif}
  :root{--line:#06C755;--bg:#0f1420;--card:#182130;--line2:#26324a;--txt:#e8eefc;--muted:#8b98b5;--gold:#f2c94c;--blue:#3b6cff}
  body{background:var(--bg);color:var(--txt);min-height:100vh}
  header{position:sticky;top:0;z-index:20;background:rgba(15,20,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line2);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  header h1{font-size:19px;display:flex;align-items:center;gap:8px}
  .who{font-size:14px;color:var(--txt);display:flex;align-items:center;gap:8px}
  .who img{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}
  .wrap{max-width:1100px;margin:0 auto;padding:18px 16px 80px}
  .toolbar{display:flex;gap:10px;margin-bottom:18px}
  .toolbar input{flex:1;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:11px 16px;color:var(--txt);font-size:15px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}}
  .prod{background:var(--card);border:1px solid var(--line2);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:.2s}
  .prod:active{transform:scale(.98)}
  .prod:hover{border-color:var(--blue)}
  .prod .img{aspect-ratio:1;background:#0d1117 center/cover no-repeat;position:relative}
  .prod .img .status{position:absolute;top:8px;left:8px;font-size:11px;padding:3px 9px;border-radius:999px;background:rgba(6,199,85,.92);color:#fff;font-weight:600}
  .prod .body{padding:11px 13px;display:flex;flex-direction:column;gap:5px;flex:1}
  .prod .name{font-size:14.5px;font-weight:600;line-height:1.4}
  .prod .price{color:var(--gold);font-size:17px;font-weight:700}
  .prod .meta{font-size:11.5px;color:var(--muted);margin-top:auto;display:flex;justify-content:space-between}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;grid-column:1/-1}
  .fab{position:fixed;right:18px;bottom:20px;background:var(--blue);color:#fff;border:none;border-radius:999px;padding:15px 22px;font-size:16px;font-weight:700;box-shadow:0 8px 24px rgba(59,108,255,.45);cursor:pointer;display:flex;align-items:center;gap:8px;z-index:15}
  /* 全螢幕 LINE 登入入口 */
  .gate{position:fixed;inset:0;background:radial-gradient(1200px 600px at 50% -8%,#132443 0%,var(--bg) 58%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;z-index:60}
  .gate .logo{width:112px;height:112px;border-radius:30px;background:linear-gradient(135deg,#06C755,#04a045);display:flex;align-items:center;justify-content:center;font-size:56px;box-shadow:0 20px 50px rgba(6,199,85,.45);margin-bottom:26px;animation:pop .5s ease}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .gate h2{font-size:27px;margin-bottom:12px;letter-spacing:1px}
  .gate p{color:var(--muted);font-size:15px;line-height:1.7;margin-bottom:36px;max-width:300px}
  .line-login{display:inline-flex;align-items:center;gap:11px;background:var(--line);color:#fff;border:none;border-radius:14px;padding:16px 44px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 12px 28px rgba(6,199,85,.42);transition:.2s}
  .line-login:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(6,199,85,.55)}
  .line-login:disabled{opacity:.6}
  .line-login i{font-size:25px}
  .gate .tip{margin-top:28px;font-size:12px;color:#5b6b8c;max-width:280px;line-height:1.6}
  .hide{display:none!important}
  /* modal */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:70;padding:18px}
  .mask.show{display:flex}
  .modal{background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:28px;width:100%;max-width:400px}
  .modal h2{font-size:20px;margin-bottom:8px}
  .modal p{color:var(--muted);font-size:13.5px;margin-bottom:20px;line-height:1.6}
  .modal input{width:100%;background:#0d1117;border:1px solid var(--line2);border-radius:12px;padding:13px;color:var(--txt);font-size:16px;margin-bottom:16px}
  .modal .save{width:100%;background:var(--blue);color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<!-- 全螢幕 LINE 登入入口 -->
<div class="gate" id="gate">
  <div class="logo">🛒</div>
  <h2>培根代購</h2>
  <p>用 LINE 一鍵登入，即可加入商品、送出訂單與追蹤進度。</p>
  <button class="line-login" id="lineLogin"><i class="fa-brands fa-line"></i> 使用 LINE 登入</button>
  <div class="tip" id="gateTip"></div>
</div>

<!-- 主畫面(登入後才顯示) -->
<div id="app" class="hide">
  <header>
    <h1>🥓 培根代購</h1>
    <div style="display:flex;align-items:center;gap:14px">
      <a id="ordersLink" href="daigou-orders.html" title="我的訂單" style="color:var(--muted);font-size:19px"><i class="fa-solid fa-receipt"></i></a>
      <span class="who" id="who" title="我的訂單" style="cursor:pointer"></span>
    </div>
  </header>
  <div class="wrap" style="padding-bottom:120px">
    <button onclick="location.href='daigou-new.html'" style="width:100%;background:transparent;border:2px dashed var(--line2);border-radius:14px;padding:16px;color:var(--muted);font-size:15px;font-weight:600;cursor:pointer;margin-bottom:18px"><i class="fa-solid fa-plus"></i> 新增商品到購物車</button>
    <h2 style="font-size:15px;color:var(--muted);margin-bottom:12px"><i class="fa-solid fa-cart-shopping"></i> 我的購物車</h2>
    <div id="cart"><div class="empty">載入中…</div></div>
  </div>
  <!-- 底部送出列 -->
  <div id="submitBar" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:16;background:rgba(15,20,32,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line2);padding:12px 16px">
    <div style="max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px">
      <div style="flex:1;font-size:14px;color:var(--muted)">共 <b id="cartCount" style="color:var(--txt)">0</b> 件商品</div>
      <button id="submitOrder" style="background:var(--line);color:#fff;border:none;border-radius:12px;padding:13px 28px;font-size:16px;font-weight:700;cursor:pointer">送出訂單</button>
    </div>
  </div>
</div>

<!-- 送出訂單 modal -->
<div class="mask" id="submitMask">
  <div class="modal">
    <h2>送出訂單</h2>
    <p id="submitDesc" style="color:var(--muted);font-size:14px;margin-bottom:16px"></p>
    <label style="display:block;font-size:13px;color:var(--muted);margin-bottom:6px">付款方式</label>
    <select id="payType" style="width:100%;background:#0d1117;border:1px solid var(--line2);border-radius:12px;padding:13px;color:var(--txt);font-size:16px;margin-bottom:16px">
      <option>訂金</option><option>全額</option>
    </select>
    <button class="save" id="confirmSubmit">確定送出</button>
    <button id="cancelSubmit" style="width:100%;background:transparent;border:none;color:var(--muted);padding:12px;margin-top:6px;cursor:pointer">取消</button>
  </div>
</div>

<!-- 填本名 modal -->
<div class="mask" id="nameMask">
  <div class="modal">
    <h2>👋 歡迎！請填寫本名</h2>
    <p>LINE 暱稱常常不是真名，代購取貨/對帳需要你的<b>真實姓名</b>，只需填一次。</p>
    <input type="text" id="realNameInput" placeholder="請輸入你的本名（例：徐培軒）" maxlength="20">
    <button class="save" id="saveName">確認，開始使用</button>
  </div>
</div>

<script type="module">
import { db } from "./js/firebase-config.js";
import { doc, getDoc, setDoc, addDoc, deleteDoc, collection, query, where, getDocs, writeBatch, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { readCachedMe, cacheMe } from "./js/daigou-auth.js";

const LIFF_ID = "2009464550-UWeV9K8C";
const $ = s => document.querySelector(s);
let me = null;

async function boot(){
  try{
    await liff.init({ liffId: LIFF_ID });
  }catch(e){
    $("#gateTip").innerHTML = "⚠️ LINE 服務初始化失敗<br>若你是站長，請確認 LINE Console 的 LIFF Endpoint 已包含本頁網址";
    return;
  }
  if(liff.isLoggedIn()){
    // 已登入:鎖住登入鈕、顯示載入中,避免跳轉過程被重複點擊
    const b = $("#lineLogin");
    b.disabled = true;
    b.style.pointerEvents = "none";
    b.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 登入中…';
    $("#gateTip").textContent = "✔ 已登入 LINE，載入中…";
    try{
      await handleLoggedIn();
    }catch(e){
      $("#gateTip").innerHTML = "⚠️ 登入後載入失敗<br>" + (e.code?("["+e.code+"] "):"") + (e.message||e);
    }
  }else if(_cachedMe && _cachedMe.hasRealName){
    // 快取還在但 LINE 登入已失效 → 導去重新登入
    liff.login();
  }
  // 未登入(且無快取)就停在漂亮的登入頁,等使用者點按鈕
}

$("#lineLogin").onclick = () => {
  if(!liff.isLoggedIn()){
    $("#lineLogin").disabled = true;
    $("#lineLogin").innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 連線中…';
    liff.login();   // 導去 LINE 授權,回來後 boot() 會偵測到已登入
  }else{
    handleLoggedIn();
  }
};

async function handleLoggedIn(){
  const p = await liff.getProfile();
  me = { lineUserId:p.userId, displayName:p.displayName, avatar:p.pictureUrl };
  const uref = doc(db, "users", p.userId);
  const snap = await getDoc(uref);
  if(snap.exists() && snap.data().realName){
    me.realName = snap.data().realName;
    cacheMe({ lineUserId:me.lineUserId, displayName:me.displayName, avatar:me.avatar||"", realName:me.realName, hasRealName:true });
    enterApp();
  }else{
    await setDoc(uref, { lineUserId:p.userId, displayName:p.displayName, avatar:p.pictureUrl||"" }, { merge:true });
    $("#nameMask").classList.add("show");
  }
}

$("#saveName").onclick = async () => {
  const v = $("#realNameInput").value.trim();
  if(v.length < 2){ alert("請輸入正確的本名"); return; }
  await setDoc(doc(db,"users",me.lineUserId), { realName:v }, { merge:true });
  me.realName = v;
  cacheMe({ lineUserId:me.lineUserId, displayName:me.displayName, avatar:me.avatar||"", realName:v, hasRealName:true });
  $("#nameMask").classList.remove("show");
  enterApp();
};

let cartItems = [];

function enterApp(){
  $("#gate").classList.add("hide");
  $("#app").classList.remove("hide");
  $("#who").innerHTML = `${me.avatar?`<img src="${me.avatar}">`:""} ${esc(me.realName)}`;
  $("#who").onclick = () => location.href = "daigou-orders.html";
  loadCart();
}

async function loadCart(){
  cartItems = [];
  try{
    const qs = await getDocs(query(collection(db,"daigouItems"),
      where("ownerUid","==",me.lineUserId), where("submitted","==",false)));
    qs.forEach(d => cartItems.push({ id:d.id, ...d.data() }));
  }catch(e){
    // 缺 composite index 時退回只查 ownerUid,前端過濾
    try{
      const qs2 = await getDocs(query(collection(db,"daigouItems"), where("ownerUid","==",me.lineUserId)));
      qs2.forEach(d => { const x = { id:d.id, ...d.data() }; if(!x.submitted) cartItems.push(x); });
    }catch(e2){}
  }
  cartItems.sort((a,b)=>((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0));
  renderCart();
}

function renderCart(){
  const c = $("#cart");
  if(!cartItems.length){
    c.innerHTML = `<div class="empty">購物車是空的，點上方「新增商品」加入你想代購的東西吧！</div>`;
    $("#submitBar").style.display = "none";
    return;
  }
  c.innerHTML = cartItems.map(x => `
    <div style="display:flex;gap:12px;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:12px;margin-bottom:12px;align-items:center">
      <div style="width:64px;height:64px;border-radius:10px;flex:none;background:#0d1117 center/cover no-repeat;background-image:url('${(x.photos&&x.photos[0])||""}')"></div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:15px;line-height:1.4">${esc(x.name||"未命名商品")}</div>
        <div style="color:var(--gold);font-weight:700;margin-top:2px">${esc(x.currency||"NT$")} ${x.price??"—"} <span style="color:var(--muted);font-weight:400;font-size:13px">× ${x.qty||1}</span></div>
        ${x.store?`<div style="font-size:12px;color:var(--muted);margin-top:2px"><i class="fa-solid fa-store"></i> ${esc(x.store)}</div>`:""}
      </div>
      <button class="delItem" data-id="${x.id}" title="刪除" style="background:transparent;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:8px"><i class="fa-solid fa-trash"></i></button>
    </div>`).join("");
  $("#cartCount").textContent = cartItems.length;
  $("#submitBar").style.display = "block";
}

// 刪除購物車商品
$("#cart").addEventListener("click", async e => {
  const btn = e.target.closest(".delItem"); if(!btn) return;
  if(!confirm("確定從購物車刪除這個商品?")) return;
  btn.disabled = true;
  try{ await deleteDoc(doc(db,"daigouItems",btn.dataset.id)); }catch(err){ alert("刪除失敗:"+err.message); }
  loadCart();
});

// 送出訂單流程
$("#submitOrder").onclick = () => {
  if(!cartItems.length) return;
  $("#submitDesc").textContent = `本次共 ${cartItems.length} 件商品，送出後可到「我的訂單」追蹤進度。`;
  $("#submitMask").classList.add("show");
};
$("#cancelSubmit").onclick = () => $("#submitMask").classList.remove("show");
$("#confirmSubmit").onclick = async () => {
  const b = $("#confirmSubmit");
  b.disabled = true; b.textContent = "送出中…";
  try{
    const orderRef = await addDoc(collection(db,"orders"), {
      ownerUid:me.lineUserId, ownerLineId:me.lineUserId, ownerRealName:me.realName, ownerDisplayName:me.displayName||"",
      itemCount:cartItems.length, payType:$("#payType").value, status:"下單",
      payLast5:"", paySlipUrl:"", createdAt:serverTimestamp(), updatedAt:serverTimestamp()
    });
    const batch = writeBatch(db);
    cartItems.forEach(it => batch.update(doc(db,"daigouItems",it.id),
      { submitted:true, orderId:orderRef.id, submittedAt:serverTimestamp() }));
    await batch.commit();
    location.href = "daigou-orders.html";
  }catch(err){
    b.disabled = false; b.textContent = "確定送出";
    alert("送出失敗:"+err.message);
  }
};

function esc(s){ return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }

// 快取優先:已登入過就直接進購物車,不再等登入載入;boot() 背景驗證
const _cachedMe = readCachedMe();
if(_cachedMe && _cachedMe.hasRealName){
  me = _cachedMe;
  enterApp();
}
boot();
</script>
</body>
</html>
