<style>
:root{

*{box-sizing:border-box;margin:0;padding:0}
body{

.bg{position:fixed;inset:0;z-index:-2;background:

.stars{position:fixed;inset:0;z-index:-1;opacity:.6;pointer-events:none;background:

.comet{position:fixed;top:12%;right:-10%;width:60vw;height:1px;z-index:-1;
  background:linear-gradient(90deg,transparent,rgba(103,232,224,.55),transparent);
  transform:rotate(-18deg);filter:blur(.3px);opacity:0;animation:comet 9s ease-in-out 1.2s infinite}
@keyframes comet{0%{opacity:0;transform:translateX(40px) rotate(-18deg)}12%{opacity:.7}30%{opacity:0;transform:translateX(-120px) rotate(-18deg)}100%{opacity:0}}

.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 30px;position:relative;z-index:1}

.nav{display:flex;align-items:center;justify-content:space-between;padding:24px 0}
.brand{display:flex;align-items:baseline;gap:12px}
.brand .w{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.25rem;letter-spacing:.04em}

.coords{font-family:"JetBrains Mono",monospace;font-size:.66rem;letter-spacing:.14em;color:var(--faint)}

.member:hover{border-color:var(--accent);color:var(--accent)}
.member .d{width:6px;height:6px;border-radius:50%;background:var(--faint);transition:.2s}

.hero{padding:78px 0 50px;animation:rise .7s cubic-bezier(.16,1,.3,1) both}

.telemetry{display:flex;gap:28px;flex-wrap:wrap;font-family:"JetBrains Mono",monospace;font-size:.7rem;color:var(--faint);letter-spacing:.1em;margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
.telemetry b{color:var(--muted);font-weight:500}

.bento{display:grid;grid-template-columns:1.25fr 1fr;grid-auto-rows:1fr;gap:16px;margin-top:30px;
  grid-template-areas:"feature play" "feature tool";min-height:430px;
  animation:rise .7s cubic-bezier(.16,1,.3,1) .1s both}
.tile{position:relative;border:1px solid var(--line);border-radius:18px;background:var(--tile);
  padding:28px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;overflow:hidden;
  transition:transform .22s ease,border-color .22s ease,background .22s ease}
.tile:hover{transform:translateY(-4px);border-color:var(--line-2);background:var(--tile-2)}
.tile:active{transform:scale(.99)}
.tile .ix{font-family:"JetBrains Mono",monospace;font-size:.72rem;color:var(--faint);letter-spacing:.1em}
.tile .ic{margin-top:18px;width:30px;height:30px;color:var(--accent);stroke-width:1.6}
.tile h3{font-size:1.7rem;font-weight:700;margin-top:auto;letter-spacing:.02em}
.tile .de{color:var(--muted);font-size:.9rem;margin-top:8px}
.tile .ar{position:absolute;top:26px;right:26px;color:var(--faint);width:20px;height:20px;transition:.22s}
.tile:hover .ar{color:var(--accent);transform:translate(3px,-3px)}

.feature{grid-area:feature;background:
  radial-gradient(120% 80% at 100% 0%, rgba(231,189,131,.12), transparent 55%), var(--tile);
  justify-content:space-between}
.feature:hover{border-color:rgba(231,189,131,.45)}

.feature h3{font-size:2.4rem}
.feature .route{position:absolute;right:-30px;bottom:-30px;width:240px;height:240px;opacity:.12;color:var(--amber)}
.feature .cta{margin-top:18px;display:inline-flex;align-items:center;gap:9px;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:.9rem;color:var(--amber)}
.tile-play{grid-area:play}.tile-tool{grid-area:tool}

footer{margin-top:auto;padding:46px 0 calc(36px + env(safe-area-inset-bottom))}
.fl{height:1px;background:var(--line);margin-bottom:20px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}

.foot .c{font-family:"JetBrains Mono",monospace;font-size:.68rem;color:var(--faint);letter-spacing:.06em}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(max-width:760px){

  .title{font-size:clamp(52px,16vw,90px)}
}
@media(prefers-reduced-motion:reduce){.comet{display:none}.hero,.bento{animation:none}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
