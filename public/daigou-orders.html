<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的訂單 · 代購</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Noto Sans TC","Segoe UI",sans-serif}
  :root{--line:#06C755;--bg:#0f1420;--card:#182130;--line2:#26324a;--txt:#e8eefc;--muted:#8b98b5;--gold:#f2c94c;--blue:#3b6cff}
  body{background:var(--bg);color:var(--txt);min-height:100vh}
  header{position:sticky;top:0;z-index:10;background:rgba(15,20,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line2);padding:12px 16px;display:flex;align-items:center;gap:12px}
  header a{color:var(--muted);text-decoration:none;font-size:20px}
  header h1{font-size:18px}
  .wrap{max-width:640px;margin:0 auto;padding:18px 16px 60px}

  .card{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:16px;margin-bottom:16px}
  .top{display:flex;gap:12px}
  .thumb{width:72px;height:72px;border-radius:12px;object-fit:cover;background:#0d1220 center/cover no-repeat;flex-shrink:0;border:1px solid var(--line2)}
  .thumb.ph{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:24px}
  .info{flex:1;min-width:0}
  .pname{font-size:16px;font-weight:700;margin-bottom:4px;word-break:break-word}
  .meta{font-size:13px;color:var(--muted);line-height:1.7}
  .meta b{color:var(--txt);font-weight:600}
  .price{color:var(--gold);font-weight:700}
  .note{font-size:13px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2);white-space:pre-wrap;word-break:break-word}

  .steps{display:flex;justify-content:space-between;margin:16px 0 4px;gap:2px}
  .step{flex:1;text-align:center;position:relative}
  .step .dot{width:16px;height:16px;border-radius:50%;background:var(--line2);margin:0 auto 6px;border:2px solid var(--line2);transition:.2s}
  .step .lbl{font-size:11px;color:var(--muted);line-height:1.2}
  .step.on .dot{background:var(--line);border-color:var(--line);box-shadow:0 0 0 3px rgba(6,199,85,.18)}
  .step.on .lbl{color:var(--txt)}
  .step::before{content:"";position:absolute;top:8px;left:-50%;width:100%;height:2px;background:var(--line2);z-index:0}
  .step:first-child::before{display:none}
  .step.on::before{background:var(--line)}
  .step .dot{position:relative;z-index:1}

  .pay{margin-top:14px;padding-top:14px;border-top:1px solid var(--line2)}
  .payinfo{font-size:14px;color:var(--muted)}
  .payinfo b{color:var(--txt)}
  .payinfo a{color:var(--blue);text-decoration:none;margin-left:10px}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--line);color:#053d1c;border:none;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none}
  .btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--txt)}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .payform{margin-top:12px;display:none}
  .payform.open{display:block}
  .payform label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
  .payform input[type=text],.payform input[type=file]{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:12px;color:var(--txt);font-size:16px}
  .payform .fmsg{font-size:13px;margin-top:8px;min-height:18px}
  .payform .actions{display:flex;gap:10px;margin-top:14px}

  .empty{text-align:center;padding:70px 20px;color:var(--muted)}
  .empty i{font-size:48px;margin-bottom:16px;display:block;color:var(--line2)}
  .empty p{margin-bottom:20px;font-size:15px}
  .status-pill{display:inline-block;font-size:12px;font-weight:700;color:var(--line);background:rgba(6,199,85,.12);border:1px solid rgba(6,199,85,.35);padding:3px 10px;border-radius:999px;margin-top:6px}
  #globalMsg{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
  .warn{background:rgba(242,201,76,.1);border:1px solid rgba(242,201,76,.35);color:var(--gold);border-radius:12px;padding:14px;font-size:14px;margin-bottom:16px}
</style>
</head>
<body>
<header>
  <a href="daigou.html" aria-label="返回"><i class="fa-solid fa-arrow-left"></i></a>
  <h1>我的訂單</h1>
</header>
<div class="wrap">
  <div id="globalMsg"><i class="fa-solid fa-spinner fa-spin"></i> 載入中…</div>
  <div id="list"></div>
</div>

<script type="module">
import { db } from "./js/firebase-config.js";
import { LIFF_ID, ORDER_STATUS } from "./js/daigou-config.js";
import { doc,getDoc,updateDoc,collection,query,where,orderBy,getDocs,serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage,ref,uploadBytes,getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

let me=null; const storage=getStorage();
const $ = s => document.querySelector(s);

// ---- 工具 ----
function esc(v){
  return String(v==null?"":v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function fmtDate(ts){
  try{
    let d=null;
    if(!ts) return "";
    if(typeof ts.toDate==="function") d=ts.toDate();
    else if(ts instanceof Date) d=ts;
    else if(typeof ts==="number") d=new Date(ts);
    else if(ts.seconds!=null) d=new Date(ts.seconds*1000);
    if(!d||isNaN(d.getTime())) return "";
    const p=n=>String(n).padStart(2,"0");
    return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }catch(e){ return ""; }
}
function toMs(ts){
  if(!ts) return 0;
  if(typeof ts.toDate==="function") return ts.toDate().getTime();
  if(ts instanceof Date) return ts.getTime();
  if(typeof ts==="number") return ts;
  if(ts.seconds!=null) return ts.seconds*1000;
  return 0;
}

// ---- LINE 登入 ----
async function initLine(){
  await liff.init({liffId:LIFF_ID});
  if(!liff.isLoggedIn()){ liff.login(); return false; }
  const p=await liff.getProfile();
  const snap=await getDoc(doc(db,"users",p.userId));
  me={ lineUserId:p.userId, displayName:p.displayName, avatar:p.pictureUrl, realName:(snap.exists()&&snap.data().realName)||p.displayName };
  return true;
}

// ---- 讀取訂單（先試 orderBy，失敗 fallback）----
async function fetchOrders(){
  const col=collection(db,"orders");
  let docs=[];
  try{
    const q=query(col, where("buyerUid","==",me.lineUserId), orderBy("createdAt","desc"));
    const snap=await getDocs(q);
    snap.forEach(d=>docs.push({id:d.id,...d.data()}));
  }catch(e){
    // 通常是缺 composite index：改用只 where，前端自行排序
    const q2=query(col, where("buyerUid","==",me.lineUserId));
    const snap=await getDocs(q2);
    snap.forEach(d=>docs.push({id:d.id,...d.data()}));
    docs.sort((a,b)=>toMs(b.createdAt)-toMs(a.createdAt));
  }
  return docs;
}

// ---- 進度條 ----
function stepsHtml(status){
  const cur=ORDER_STATUS.indexOf(status);
  return `<div class="steps">${ORDER_STATUS.map((s,i)=>
    `<div class="step ${i<=cur?"on":""}"><div class="dot"></div><div class="lbl">${esc(s)}</div></div>`
  ).join("")}</div>`;
}

// ---- 單張卡片 ----
function cardHtml(o){
  const thumb = o.productPhoto
    ? `<div class="thumb" style="background-image:url('${esc(o.productPhoto)}')"></div>`
    : `<div class="thumb ph"><i class="fa-solid fa-box"></i></div>`;
  const priceLine = (o.productPrice!=null && o.productPrice!=="")
    ? `<span class="price">${esc(o.productCurrency||"")}${esc(o.productPrice)}</span>` : "";
  const created = fmtDate(o.createdAt);
  const metaRows=[];
  metaRows.push(`數量 <b>${esc(o.qty!=null?o.qty:1)}</b>${priceLine?` ・ 預估單價 ${priceLine}`:""}`);
  if(o.payType) metaRows.push(`付款方式 <b>${esc(o.payType)}</b>`);
  if(created) metaRows.push(`下單時間 <b>${esc(created)}</b>`);

  const noteHtml = o.note ? `<div class="note">${esc(o.note)}</div>` : "";

  // 付款資訊區
  let payHtml="";
  if(!o.payLast5){
    payHtml=`
      <div class="pay">
        <button class="btn" data-act="toggle" data-id="${esc(o.id)}"><i class="fa-solid fa-money-check-dollar"></i> 我要填付款資訊</button>
        <div class="payform" id="pf-${esc(o.id)}">
          <label>匯款帳號後五碼</label>
          <input type="text" inputmode="numeric" maxlength="5" pattern="[0-9]*" id="last5-${esc(o.id)}" placeholder="例：12345">
          <label>上傳匯款截圖（選填）</label>
          <input type="file" accept="image/*" id="slip-${esc(o.id)}">
          <div class="fmsg" id="fmsg-${esc(o.id)}"></div>
          <div class="actions">
            <button class="btn" data-act="submit" data-id="${esc(o.id)}"><i class="fa-solid fa-paper-plane"></i> 送出</button>
            <button class="btn ghost" data-act="cancel" data-id="${esc(o.id)}">取消</button>
          </div>
        </div>
      </div>`;
  }else{
    const slip = o.paySlipUrl
      ? `<a href="${esc(o.paySlipUrl)}" target="_blank" rel="noopener"><i class="fa-solid fa-image"></i> 查看截圖</a>` : "";
    payHtml=`
      <div class="pay">
        <div class="payinfo"><i class="fa-solid fa-circle-check" style="color:var(--line)"></i> 末五碼：<b>${esc(o.payLast5)}</b>${slip}</div>
      </div>`;
  }

  return `
  <div class="card" data-id="${esc(o.id)}">
    <div class="top">
      ${thumb}
      <div class="info">
        <div class="pname">${esc(o.productName||"（未命名商品）")}</div>
        <div class="meta">${metaRows.map(r=>`<div>${r}</div>`).join("")}</div>
        <span class="status-pill">${esc(o.status||ORDER_STATUS[0])}</span>
      </div>
    </div>
    ${stepsHtml(o.status||ORDER_STATUS[0])}
    ${noteHtml}
    ${payHtml}
  </div>`;
}

// ---- 渲染 ----
async function render(){
  const list=$("#list"); const g=$("#globalMsg");
  g.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> 載入訂單中…';
  list.innerHTML="";
  let orders=[];
  try{
    orders=await fetchOrders();
  }catch(e){
    g.innerHTML=`<div class="warn">讀取訂單失敗：${esc(e.message||e)}</div>`;
    return;
  }
  g.style.display="none";
  if(!orders.length){
    list.innerHTML=`
      <div class="empty">
        <i class="fa-solid fa-receipt"></i>
        <p>你還沒有任何訂單，去商品牆逛逛吧</p>
        <a class="btn" href="daigou.html"><i class="fa-solid fa-store"></i> 前往商品牆</a>
      </div>`;
    return;
  }
  list.innerHTML=orders.map(cardHtml).join("");
}

// ---- 送出付款資訊 ----
async function submitPay(orderId){
  const last5El=$(`#last5-${CSS.escape(orderId)}`);
  const slipEl=$(`#slip-${CSS.escape(orderId)}`);
  const msgEl=$(`#fmsg-${CSS.escape(orderId)}`);
  const last5=(last5El.value||"").trim();
  if(!/^\d{5}$/.test(last5)){
    msgEl.style.color="var(--gold)";
    msgEl.textContent="請輸入 5 位數字的帳號後五碼";
    return;
  }
  const btn=document.querySelector(`[data-act="submit"][data-id="${CSS.escape(orderId)}"]`);
  if(btn) btn.disabled=true;
  msgEl.style.color="var(--muted)";
  msgEl.textContent="送出中…";
  try{
    const payload={ payLast5:last5, status:"已付款", updatedAt:serverTimestamp() };
    const f=slipEl && slipEl.files && slipEl.files[0];
    if(f){
      msgEl.textContent="上傳截圖中…";
      const path=`daigou_slip/${me.lineUserId}/${orderId}_${Date.now()}.jpg`;
      const r=ref(storage,path);
      await uploadBytes(r,f);
      payload.paySlipUrl=await getDownloadURL(r);
    }
    await updateDoc(doc(db,"orders",orderId), payload);
    msgEl.style.color="var(--line)";
    msgEl.textContent="✅ 已送出，感謝！";
    await render();
  }catch(err){
    if(btn) btn.disabled=false;
    msgEl.style.color="var(--gold)";
    msgEl.textContent="❌ 送出失敗："+(err.message||err);
  }
}

// ---- 事件委派 ----
$("#list").addEventListener("click", e=>{
  const t=e.target.closest("[data-act]");
  if(!t) return;
  const id=t.dataset.id;
  const act=t.dataset.act;
  if(act==="toggle"){ const pf=$(`#pf-${CSS.escape(id)}`); if(pf) pf.classList.toggle("open"); }
  else if(act==="cancel"){ const pf=$(`#pf-${CSS.escape(id)}`); if(pf) pf.classList.remove("open"); }
  else if(act==="submit"){ submitPay(id); }
});

// ---- 啟動 ----
(async function(){
  try{
    const ok=await initLine();
    if(!ok) return; // 已觸發 liff.login()
    await render();
  }catch(e){
    $("#globalMsg").innerHTML=`<div class="warn"><i class="fa-solid fa-triangle-exclamation"></i> 無法登入 LINE（本機預覽或設定問題）：${esc(e.message||e)}<br>請部署到網域後於手機 LINE 內開啟。</div>`;
  }
})();
</script>
</body>
</html>
