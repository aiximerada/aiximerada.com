<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的訂單 - 培根代購</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root{
      --line:#06C755;--bg:#0f1420;--card:#182130;--line2:#26324a;
      --txt:#e8eefc;--muted:#8b98b5;--gold:#f2c94c;--blue:#3b6cff;--red:#ff5a6a;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      background:var(--bg);color:var(--txt);
      font-family:"Noto Sans TC","Segoe UI",sans-serif;
      min-height:100vh;-webkit-font-smoothing:antialiased;
    }
    .wrap{max-width:680px;margin:0 auto;padding:0 14px 60px}
    header{
      position:sticky;top:0;z-index:20;
      display:flex;align-items:center;gap:12px;
      max-width:680px;margin:0 auto;padding:14px;
      background:rgba(15,20,32,.92);backdrop-filter:blur(8px);
      border-bottom:1px solid var(--line2);
    }
    header a.back{color:var(--txt);font-size:20px;text-decoration:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px}
    header a.back:hover{background:var(--line2)}
    header h1{font-size:18px;font-weight:700}

    .hint{
      background:var(--card);border:1px solid var(--line2);border-radius:14px;
      padding:16px;margin:16px 0;color:var(--muted);text-align:center;line-height:1.7;
    }
    .hint i{color:var(--gold);margin-right:6px}

    .loading{text-align:center;color:var(--muted);padding:40px 0}
    .loading i{font-size:26px}

    /* 訂單卡片 */
    .order{
      background:var(--card);border:1px solid var(--line2);border-radius:16px;
      padding:16px;margin:16px 0;overflow:hidden;
    }
    .order-head{
      display:flex;justify-content:space-between;align-items:flex-start;
      gap:10px;margin-bottom:14px;
    }
    .order-time{font-size:13px;color:var(--muted)}
    .order-id{font-size:11px;color:var(--line2);margin-top:2px;word-break:break-all}
    .status-badge{
      font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;white-space:nowrap;
      background:rgba(6,199,85,.15);color:var(--line);border:1px solid rgba(6,199,85,.4);
    }
    .status-badge.cancel{background:rgba(255,90,106,.15);color:var(--red);border-color:rgba(255,90,106,.4)}

    /* 進度條 */
    .steps{display:flex;justify-content:space-between;margin:6px 0 18px;position:relative}
    .steps::before{
      content:"";position:absolute;top:9px;left:6%;right:6%;height:2px;background:var(--line2);z-index:0;
    }
    .step{position:relative;z-index:1;flex:1;text-align:center}
    .dot{
      width:18px;height:18px;border-radius:50%;margin:0 auto 6px;
      background:var(--line2);border:2px solid var(--card);
    }
    .step.on .dot{background:var(--line);box-shadow:0 0 0 3px rgba(6,199,85,.18)}
    .step .lbl{font-size:11px;color:var(--muted);line-height:1.2}
    .step.on .lbl{color:var(--txt);font-weight:600}
    .steps.cancelled .dot{background:var(--line2)!important;box-shadow:none!important}
    .steps.cancelled .lbl{color:var(--muted)!important;font-weight:400!important}

    /* 商品列 */
    .items{border-top:1px solid var(--line2);padding-top:12px}
    .item{
      display:flex;gap:12px;align-items:center;padding:10px 0;
      border-bottom:1px dashed var(--line2);
    }
    .item:last-child{border-bottom:none}
    .item.cancelled{opacity:.45}
    .item.cancelled .it-name,.item.cancelled .it-meta{text-decoration:line-through}
    .thumb{
      width:56px;height:56px;border-radius:10px;object-fit:cover;flex-shrink:0;
      background:var(--line2);display:flex;align-items:center;justify-content:center;color:var(--muted);
    }
    .it-body{flex:1;min-width:0}
    .it-name{font-size:14px;font-weight:600;line-height:1.4;word-break:break-word}
    .it-meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:8px}
    .it-meta .price{color:var(--gold);font-weight:600}
    .tag-cancel{
      display:inline-block;font-size:11px;color:var(--red);
      border:1px solid rgba(255,90,106,.4);border-radius:6px;padding:1px 6px;margin-top:4px;
    }
    .it-right{flex-shrink:0}
    .btn-x{
      background:none;border:1px solid rgba(255,90,106,.4);color:var(--red);
      font-size:12px;padding:5px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;
    }
    .btn-x:hover{background:rgba(255,90,106,.12)}

    /* 付款區 */
    .pay{margin-top:14px;border-top:1px solid var(--line2);padding-top:14px}
    .pay-row{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
    .pay-row b{color:var(--txt)}
    .pay-row a{color:var(--blue);text-decoration:none}
    .pay-row a:hover{text-decoration:underline}
    .btn{
      display:inline-flex;align-items:center;gap:6px;justify-content:center;
      border:none;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;
      cursor:pointer;font-family:inherit;
    }
    .btn-pay{background:var(--blue);color:#fff;width:100%;margin-top:4px}
    .btn-ghost-red{
      background:none;border:1px solid rgba(255,90,106,.5);color:var(--red);
      width:100%;margin-top:14px;
    }
    .btn-ghost-red:hover{background:rgba(255,90,106,.12)}
    .btn-primary{background:var(--line);color:#fff}
    .btn:disabled{opacity:.5;cursor:not-allowed}

    .pay-form{
      margin-top:12px;background:rgba(59,108,255,.06);border:1px solid rgba(59,108,255,.25);
      border-radius:12px;padding:14px;display:none;
    }
    .pay-form.open{display:block}
    .pay-form label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
    .pay-form input[type=text]{
      width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--txt);
      border-radius:8px;padding:10px;font-size:15px;letter-spacing:2px;margin-bottom:12px;font-family:inherit;
    }
    .pay-form input[type=file]{width:100%;font-size:12px;color:var(--muted);margin-bottom:12px}
    .pay-form input:focus{outline:none;border-color:var(--blue)}

    /* 空狀態 */
    .empty{text-align:center;padding:60px 20px;color:var(--muted)}
    .empty i{font-size:44px;color:var(--line2);margin-bottom:16px;display:block}
    .empty p{margin-bottom:20px;font-size:15px}
    .empty a{
      display:inline-flex;align-items:center;gap:8px;text-decoration:none;
      background:var(--line);color:#fff;padding:12px 24px;border-radius:12px;font-weight:600;
    }
    .spin{animation:sp 1s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <header>
    <a class="back" href="daigou.html" aria-label="返回"><i class="fa-solid fa-arrow-left"></i></a>
    <h1>我的訂單</h1>
  </header>
  <div class="wrap">
    <div id="app">
      <div class="loading"><i class="fa-solid fa-spinner spin"></i><p style="margin-top:10px">載入中…</p></div>
    </div>
  </div>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { LIFF_ID, ORDER_STATUS } from "./js/daigou-config.js";
    import { doc,getDoc,updateDoc,collection,query,where,getDocs,writeBatch,serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getStorage,ref,uploadBytes,getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
    import { readCachedMe, ensureFreshMe } from "./js/daigou-auth.js";

    let me=null; const storage=getStorage();
    const app=document.getElementById("app");

    // ---- 工具 ----
    function esc(s){
      return String(s==null?"":s)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;")
        .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
    function toDate(v){
      try{
        if(!v) return null;
        if(typeof v.toDate==="function") return v.toDate();
        if(typeof v.seconds==="number") return new Date(v.seconds*1000);
        if(v instanceof Date) return v;
        const d=new Date(v); return isNaN(d)?null:d;
      }catch(e){ return null; }
    }
    function secOf(v){
      if(!v) return 0;
      if(typeof v.seconds==="number") return v.seconds;
      const d=toDate(v); return d?d.getTime()/1000:0;
    }
    function fmtDate(v){
      const d=toDate(v);
      if(!d) return "—";
      const p=n=>String(n).padStart(2,"0");
      return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    async function initLine(){
      await liff.init({liffId:LIFF_ID});
      if(!liff.isLoggedIn()){ liff.login(); return false; }
      const p=await liff.getProfile();
      const snap=await getDoc(doc(db,"users",p.userId));
      me={ lineUserId:p.userId, displayName:p.displayName, realName:(snap.exists()&&snap.data().realName)||p.displayName };
      return true;
    }

    // ---- 讀取資料 ----
    async function loadData(){
      // 訂單表頭
      let orders=[];
      const oSnap=await getDocs(query(collection(db,"orders"), where("ownerUid","==",me.lineUserId)));
      oSnap.forEach(d=>orders.push({id:d.id, ...d.data()}));
      orders.sort((a,b)=>secOf(b.createdAt)-secOf(a.createdAt));

      // 商品(需 submitted==true),缺 index 時 fallback
      let itemDocs=[];
      try{
        const iSnap=await getDocs(query(collection(db,"daigouItems"),
          where("ownerUid","==",me.lineUserId), where("submitted","==",true)));
        iSnap.forEach(d=>itemDocs.push({id:d.id, ...d.data()}));
      }catch(err){
        console.warn("composite index 缺失,fallback:", err);
        const iSnap=await getDocs(query(collection(db,"daigouItems"),
          where("ownerUid","==",me.lineUserId)));
        iSnap.forEach(d=>{ const x={id:d.id, ...d.data()}; if(x.submitted===true) itemDocs.push(x); });
      }
      // 依 orderId 分組
      const map={};
      itemDocs.forEach(it=>{
        const k=it.orderId||"__none__";
        (map[k]=map[k]||[]).push(it);
      });
      return {orders, itemsByOrder:map};
    }

    // ---- 渲染 ----
    function renderSteps(status){
      const cancelled = status==="已取消";
      const idx = ORDER_STATUS.indexOf(status);
      let html=`<div class="steps${cancelled?" cancelled":""}">`;
      ORDER_STATUS.forEach((st,i)=>{
        const on = !cancelled && idx>=0 && i<=idx;
        html+=`<div class="step${on?" on":""}"><div class="dot"></div><div class="lbl">${esc(st)}</div></div>`;
      });
      html+=`</div>`;
      return html;
    }

    function renderItem(it){
      const cancelled = it.cancelled===true;
      const photo = (Array.isArray(it.photos)&&it.photos[0])?it.photos[0]:"";
      const thumb = photo
        ? `<img class="thumb" src="${esc(photo)}" alt="" onerror="this.outerHTML='<div class=&quot;thumb&quot;><i class=&quot;fa-regular fa-image&quot;></i></div>'">`
        : `<div class="thumb"><i class="fa-regular fa-image"></i></div>`;
      const meta=[];
      meta.push(`<span>x${esc(it.qty||1)}</span>`);
      if(it.price!=null&&it.price!=="") meta.push(`<span class="price">${esc(it.currency||"")}${esc(it.price)}</span>`);
      if(it.store) meta.push(`<span><i class="fa-solid fa-shop" style="opacity:.6"></i> ${esc(it.store)}</span>`);
      return `<div class="item${cancelled?" cancelled":""}">
        ${thumb}
        <div class="it-body">
          <div class="it-name">${esc(it.name||"(未命名商品)")}</div>
          <div class="it-meta">${meta.join("")}</div>
          ${cancelled?`<span class="tag-cancel">已取消</span>`:""}
        </div>
        <div class="it-right">
          ${(!cancelled && it.__canCancel)?`<button class="btn-x" data-cancel-item="${esc(it.id)}">取消此商品</button>`:""}
        </div>
      </div>`;
    }

    function renderPay(order){
      const oid=order.id;
      const cancelled = order.status==="已取消";
      if(order.payLast5){
        const slip = order.paySlipUrl
          ? ` &nbsp;·&nbsp; <a href="${esc(order.paySlipUrl)}" target="_blank"><i class="fa-solid fa-image"></i> 查看截圖</a>` : "";
        return `<div class="pay"><div class="pay-row"><i class="fa-solid fa-circle-check" style="color:var(--line)"></i> 末五碼:<b>${esc(order.payLast5)}</b>${slip}</div></div>`;
      }
      if(cancelled) return "";
      // 未填付款資訊
      return `<div class="pay">
        <button class="btn btn-pay" data-toggle-pay="${esc(oid)}"><i class="fa-solid fa-money-bill-wave"></i> 填付款資訊</button>
        <div class="pay-form" id="payform-${esc(oid)}">
          <label>匯款帳號末五碼</label>
          <input type="text" inputmode="numeric" maxlength="5" pattern="[0-9]*" placeholder="12345" id="last5-${esc(oid)}">
          <label>上傳匯款截圖(選填)</label>
          <input type="file" accept="image/*" id="slip-${esc(oid)}">
          <button class="btn btn-primary" style="width:100%" data-submit-pay="${esc(oid)}"><i class="fa-solid fa-paper-plane"></i> 送出</button>
        </div>
      </div>`;
    }

    function renderOrder(order, items){
      const cancelled = order.status==="已取消";
      const done = order.status==="已取貨";
      const canCancel = !cancelled && !done;   // 已取貨/已取消 不可再取消
      const badge = cancelled
        ? `<span class="status-badge cancel">已取消</span>`
        : `<span class="status-badge">${esc(order.status||"下單")}</span>`;

      // 標記商品是否可取消
      items.forEach(it=>{ it.__canCancel=canCancel; });
      const itemsHtml = items.length
        ? items.map(renderItem).join("")
        : `<div style="color:var(--muted);font-size:13px;padding:8px 0">此訂單沒有商品資料</div>`;

      return `<div class="order">
        <div class="order-head">
          <div>
            <div class="order-time"><i class="fa-regular fa-clock"></i> ${fmtDate(order.createdAt)}</div>
            <div class="order-id">單號 ${esc(order.id)}</div>
          </div>
          ${badge}
        </div>
        ${renderSteps(order.status)}
        <div class="items">${itemsHtml}</div>
        ${renderPay(order)}
        ${canCancel?`<button class="btn btn-ghost-red" data-cancel-order="${esc(order.id)}"><i class="fa-solid fa-ban"></i> 取消整筆訂單</button>`:""}
      </div>`;
    }

    async function render(){
      app.innerHTML=`<div class="loading"><i class="fa-solid fa-spinner spin"></i><p style="margin-top:10px">載入中…</p></div>`;
      let data;
      try{
        data=await loadData();
      }catch(err){
        console.error(err);
        app.innerHTML=`<div class="hint"><i class="fa-solid fa-triangle-exclamation"></i>載入訂單失敗:${esc(err.message||err)}</div>`;
        return;
      }
      const {orders, itemsByOrder}=data;
      if(!orders.length){
        app.innerHTML=`<div class="empty">
          <i class="fa-solid fa-box-open"></i>
          <p>你還沒有送出任何訂單</p>
          <a href="daigou.html"><i class="fa-solid fa-cart-shopping"></i> 去購物車</a>
        </div>`;
        return;
      }
      // 保存以供事件用
      window.__ORDERS=orders;
      window.__ITEMS=itemsByOrder;
      app.innerHTML = orders.map(o=>renderOrder(o, (itemsByOrder[o.id]||[]).slice().sort((a,b)=>secOf(a.createdAt)-secOf(b.createdAt)))).join("");
      bindEvents();
    }

    // ---- 事件 ----
    function bindEvents(){
      app.querySelectorAll("[data-toggle-pay]").forEach(b=>{
        b.onclick=()=>{
          const f=document.getElementById("payform-"+b.dataset.togglePay);
          if(f) f.classList.toggle("open");
        };
      });
      app.querySelectorAll("[data-submit-pay]").forEach(b=>{
        b.onclick=()=>submitPay(b.dataset.submitPay, b);
      });
      app.querySelectorAll("[data-cancel-item]").forEach(b=>{
        b.onclick=()=>cancelItem(b.dataset.cancelItem, b);
      });
      app.querySelectorAll("[data-cancel-order]").forEach(b=>{
        b.onclick=()=>cancelOrder(b.dataset.cancelOrder, b);
      });
    }

    async function submitPay(orderId, btn){
      const last5=(document.getElementById("last5-"+orderId)||{}).value||"";
      const clean=last5.replace(/\D/g,"").slice(0,5);
      if(clean.length<5){ alert("請輸入匯款帳號末五碼(5 位數字)"); return; }
      const fileEl=document.getElementById("slip-"+orderId);
      const file=fileEl&&fileEl.files&&fileEl.files[0]?fileEl.files[0]:null;
      btn.disabled=true; const old=btn.innerHTML; btn.innerHTML=`<i class="fa-solid fa-spinner spin"></i> 送出中…`;
      try{
        let url=null;
        if(file){
          const path=`daigou_slip/${me.lineUserId}/${orderId}_${Date.now()}.jpg`;
          const r=ref(storage,path);
          await uploadBytes(r,file);
          url=await getDownloadURL(r);
        }
        const upd={ payLast5:clean, status:"已付款", updatedAt:serverTimestamp() };
        if(url) upd.paySlipUrl=url;
        await updateDoc(doc(db,"orders",orderId), upd);
        await render();
      }catch(err){
        console.error(err);
        alert("送出失敗:"+(err.message||err));
        btn.disabled=false; btn.innerHTML=old;
      }
    }

    async function cancelItem(itemId, btn){
      if(!confirm("確定取消此商品?")) return;
      btn.disabled=true;
      try{
        await updateDoc(doc(db,"daigouItems",itemId), {cancelled:true});
        await render();
      }catch(err){
        console.error(err);
        alert("取消失敗:"+(err.message||err));
        btn.disabled=false;
      }
    }

    async function cancelOrder(orderId, btn){
      if(!confirm("確定取消整筆訂單?")) return;
      btn.disabled=true; const old=btn.innerHTML; btn.innerHTML=`<i class="fa-solid fa-spinner spin"></i> 處理中…`;
      try{
        const items=(window.__ITEMS&&window.__ITEMS[orderId])||[];
        const batch=writeBatch(db);
        items.forEach(it=>{ batch.update(doc(db,"daigouItems",it.id), {cancelled:true}); });
        batch.update(doc(db,"orders",orderId), {status:"已取消", updatedAt:serverTimestamp()});
        await batch.commit();
        await render();
      }catch(err){
        console.error(err);
        alert("取消訂單失敗:"+(err.message||err));
        btn.disabled=false; btn.innerHTML=old;
      }
    }

    // ---- 啟動(快取優先,背景驗證) ----
    (async ()=>{
      try{
        const cached=readCachedMe();
        if(cached && cached.realName){ me=cached; try{ await render(); }catch(e){} }
        me=await ensureFreshMe();   // 未登入會自動跳轉登入
        await render();
      }catch(err){
        console.error(err);
        app.innerHTML=`<div class="hint"><i class="fa-solid fa-triangle-exclamation"></i>初始化失敗,請重新整理或稍後再試。<br><span style="font-size:12px;opacity:.7">${esc(err.message||err)}</span></div>`;
      }
    })();
  </script>
</body>
</html>
